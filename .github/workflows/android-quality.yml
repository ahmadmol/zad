name: Android Quality Gates

on:
  push:
    branches: [ main, master, 'chore/**', 'refactor/**' ]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: |
          ./gradlew :designsystem:testDebugUnitTest \
            :feature:testDebugUnitTest \
            :app:testDebugUnitTest \
            --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-parallel --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          if-no-files-found: ignore

  # Instrumented / connected tests are intentionally omitted from PR CI
  # (device/emulator cost). Run manually or via a scheduled workflow when available.
